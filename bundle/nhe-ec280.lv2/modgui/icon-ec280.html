<div class="mod-pedal ec280{{{cns}}}">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>
    <div class="ec-knob ec-return_level" title="Return" mod-role="input-control-port" mod-port-symbol="return_level"></div>
    <div class="ec-knob ec-duration" title="Duration" mod-role="input-control-port" mod-port-symbol="duration"></div>
    <div class="ec-knob ec-speed" title="Speed" mod-role="input-control-port" mod-port-symbol="speed"></div>
    <div class="ec-knob ec-volume" title="Volume" mod-role="input-control-port" mod-port-symbol="volume"></div>
    <div class="ec-knob ec-chorus" title="Chorus" mod-role="input-control-port" mod-port-symbol="chorus"></div>
    <div class="ec-switch ec-tails" title="Tail" ec-switch="tails"></div>
    <div class="ec-switch ec-range" title="Range: 300 / 600 ms" ec-switch="range"></div>
    <div class="ec-switch ec-mode" title="Echo / Reverb" ec-switch="mode"></div>
    <div class="ec-onoff" title="On/Off" mod-role="bypass"></div>
    <div class="ec-bank ec-E1" title="Echo 1: tap = this one only, hold = add / remove" ec-bank="echo_taps" ec-bit="0"></div>
    <div class="ec-bank ec-E2" title="Echo 2: tap = this one only, hold = add / remove" ec-bank="echo_taps" ec-bit="1"></div>
    <div class="ec-bank ec-E3" title="Echo 3: tap = this one only, hold = add / remove" ec-bank="echo_taps" ec-bit="2"></div>
    <div class="ec-bank ec-E4" title="Echo 4: tap = this one only, hold = add / remove" ec-bank="echo_taps" ec-bit="3"></div>
    <div class="ec-bank ec-R1" title="Reverb 1: tap = this one only, hold = add / remove" ec-bank="hall_taps" ec-bit="0"></div>
    <div class="ec-bank ec-R2" title="Reverb 2: tap = this one only, hold = add / remove" ec-bank="hall_taps" ec-bit="1"></div>
    <div class="ec-bank ec-R3" title="Reverb 3: tap = this one only, hold = add / remove" ec-bank="hall_taps" ec-bit="2"></div>
    <div class="ec-bank ec-R4" title="Reverb 4: tap = this one only, hold = add / remove" ec-bank="hall_taps" ec-bit="3"></div>
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
